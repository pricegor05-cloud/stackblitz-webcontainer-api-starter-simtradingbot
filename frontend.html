<!DOCTYPE html>
<html>
<head>
    <title>AI Hedge Fund Terminal</title>
    <style>
        body {
            background: #0d0d0d;
            color: white;
            font-family: Arial;
        }
        .box {
            background: #1e1e1e;
            padding: 15px;
            margin: 10px;
            border-radius: 10px;
        }
        .green { color: #00ff88; }
        .red { color: #ff4d4d; }
    </style>
</head>

<body>
    <h1>🏦 AI Hedge Fund Terminal</h1>

    <div class="box">
        <h2>Equity: <span id="equity">Loading...</span></h2>
        <h3>Cash: <span id="cash"></span></h3>
    </div>

    <div class="box">
        <h2>AI Scores</h2>
        <pre id="agents"></pre>
    </div>

    <div class="box">
        <h2>Trades</h2>
        <pre id="trades"></pre>
    </div>

    <script>
        let ws;
        
        function connectWS() {
            ws = new WebSocket(`ws://${location.host}/ws`);
        
            ws.onopen = () => {
                console.log("✅ Connected to WebSocket");
            };
        
            ws.onmessage = (event) => {
                const d = JSON.parse(event.data);
        
                document.getElementById("equity").innerHTML =
                    "<span class='good'>$" + (d.equity || 0) + "</span>";
        
                document.getElementById("cash").innerHTML =
                    "$" + (d.cash || 0);
        
                document.getElementById("chop").innerHTML =
                    d.chop_zone ? "<span class='warn'>YES</span>" : "NO";
        
                document.getElementById("agents").innerText =
                    JSON.stringify(d.active_agents || [], null, 2);
        
                document.getElementById("scores").innerText =
                    JSON.stringify(d.agent_scores || {}, null, 2);
        
                document.getElementById("trades").innerText =
                    JSON.stringify(d.trades || [], null, 2);
            };
        
            ws.onclose = () => {
                console.log("❌ WS Disconnected... reconnecting");
                setTimeout(connectWS, 2000);
            };
        }
        
        connectWS();
        </script>
