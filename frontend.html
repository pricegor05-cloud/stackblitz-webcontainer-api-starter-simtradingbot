<!DOCTYPE html>
<html>
<head>
    <title>AI Hedge Fund Terminal</title>
    <style>
        body {
            background: #0d0d0d;
            color: white;
            font-family: Arial;
        }
        .box {
            background: #1e1e1e;
            padding: 15px;
            margin: 10px;
            border-radius: 10px;
        }
        .green { color: #00ff88; }
        .red { color: #ff4d4d; }
    </style>
</head>

<body>
    <h1>🏦 AI Hedge Fund Terminal</h1>

    <div class="box">
        <h2>Equity: <span id="equity">Loading...</span></h2>
        <h3>Cash: <span id="cash"></span></h3>
    </div>

    <div class="box">
        <h2>AI Scores</h2>
        <pre id="agents"></pre>
    </div>

    <div class="box">
        <h2>Trades</h2>
        <pre id="trades"></pre>
    </div>

    <script>
        let ws;
        
        const safe = (v, d) => (v === undefined || v === null ? d : v);
        
        function connectWS() {
            ws = new WebSocket(`ws://${location.host}/ws`);
        
            ws.onopen = () => {
                console.log("✅ WS Connected");
            };
        
            ws.onmessage = (event) => {
                try {
                    const d = JSON.parse(event.data) || {};
        
                    const equity = safe(d.equity, 0);
                    const cash = safe(d.cash, 0);
                    const chop = safe(d.chop_zone, false);
                    const agents = safe(d.active_agents, []);
                    const scores = safe(d.agent_scores, {});
                    const trades = safe(d.trades, []);
        
                    document.getElementById("equity").innerHTML =
                        "<span class='good'>$" + equity + "</span>";
        
                    document.getElementById("cash").innerHTML =
                        "$" + cash;
        
                    document.getElementById("chop").innerHTML =
                        chop ? "<span class='warn'>YES</span>" : "NO";
        
                    document.getElementById("agents").innerText =
                        JSON.stringify(agents, null, 2);
        
                    document.getElementById("scores").innerText =
                        JSON.stringify(scores, null, 2);
        
                    document.getElementById("trades").innerText =
                        JSON.stringify(trades, null, 2);
        
                } catch (err) {
                    console.log("⚠️ UI parse fail:", err);
                }
            };
        
            ws.onerror = () => {
                console.log("⚠️ WS error");
            };
        
            ws.onclose = () => {
                console.log("❌ WS closed, reconnecting...");
                setTimeout(connectWS, 2000);
            };
        }
        
        connectWS();
        </script>
